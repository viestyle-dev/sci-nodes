name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Create ledger access token
        id: ledger-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLA_APP_ID }}
          private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}
          owner: viestyle-dev
          repositories: cla-signatures

      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.ledger-token.outputs.token }}
        with:
          path-to-signatures: signatures/nonoha-cla-v1.json
          path-to-document: https://github.com/viestyle-dev/sci-nodes/blob/main/CLA.md
          remote-organization-name: viestyle-dev
          remote-repository-name: cla-signatures
          branch: main
          lock-pullrequest-aftermerge: true
          custom-notsigned-prcomment: >
            Thank you for your contribution! Before we can merge, please
            read our [CLA](https://github.com/viestyle-dev/sci-nodes/blob/main/CLA.md)
            and sign by commenting the sentence below.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: >
            All contributors have signed the CLA. Contributions in this pull
            request are covered by the
            [nonoha CLA](https://github.com/viestyle-dev/sci-nodes/blob/main/CLA.md)
            that each author previously signed.
